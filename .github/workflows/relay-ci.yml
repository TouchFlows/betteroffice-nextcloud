name: relay CI

on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay-ci.yml']
  pull_request:
    paths: ['relay/**', '.github/workflows/relay-ci.yml']

defaults:
  run:
    working-directory: relay

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    services:
      # Phase 3's room/store/wsServer/migrate tests run against a real
      # MariaDB, matching the dedicated-database requirement (PLAN.md §5.2)
      # -- a mock would not catch a SQL mistake in the actual schema.
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_only
          MARIADB_DATABASE: betteroffice_relay_test
          MARIADB_USER: betteroffice_relay_test
          MARIADB_PASSWORD: test_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      BETTEROFFICE_RELAY_DB_HOST: 127.0.0.1
      BETTEROFFICE_RELAY_DB_NAME: betteroffice_relay_test
      BETTEROFFICE_RELAY_DB_USER: betteroffice_relay_test
      BETTEROFFICE_RELAY_DB_PASSWORD: test_only_password
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - run: npm ci
      - run: npm run typecheck

      - name: Apply relay migrations
        run: npm run migrate

      - name: Create migrate.test.ts's dedicated database
        # No mariadb/mysql CLI client is preinstalled on this runner image;
        # the `mariadb` npm driver is already proven working by the
        # migration step above, so use it here too instead of installing a
        # system package just for one statement.
        run: |
          node --input-type=module -e "
            import mariadb from 'mariadb';
            const conn = await mariadb.createConnection({ host: '127.0.0.1', user: 'root', password: 'ci_root_only' });
            await conn.query('CREATE DATABASE IF NOT EXISTS betteroffice_relay_migrate_test');
            await conn.query(\"GRANT ALL PRIVILEGES ON betteroffice_relay_migrate_test.* TO 'betteroffice_relay_test'@'%'\");
            await conn.query('FLUSH PRIVILEGES');
            await conn.end();
          "

      - run: npm test
      - run: npm run build

      - name: Dependency audit (shipped service only — fails the build)
        run: npm audit --omit=dev

      - name: Dependency audit (dev tooling — warns only)
        if: always()
        run: npm audit || echo "::warning::npm audit found issues outside production deps; see docs/security.md"
