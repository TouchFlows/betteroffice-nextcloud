name: relay CI

on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay-ci.yml']
  pull_request:
    paths: ['relay/**', '.github/workflows/relay-ci.yml']

defaults:
  run:
    working-directory: relay

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Dependency audit (shipped service only — fails the build)
        run: npm audit --omit=dev

      - name: Dependency audit (dev tooling — warns only)
        if: always()
        run: npm audit || echo "::warning::npm audit found issues outside production deps; see docs/security.md"
