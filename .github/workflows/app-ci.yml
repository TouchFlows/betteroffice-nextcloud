name: app CI

on:
  push:
    branches: [main]
    # relay/** too: the editor e2e suite starts the real relay and proves
    # collaboration through it, so a relay change must re-run this workflow.
    paths: ['app/**', 'relay/**', '.github/workflows/app-ci.yml']
  # Deliberately unfiltered on pull requests. These jobs are required status
  # checks on main, and a path-filtered workflow that does not run leaves its
  # required checks "Expected -- waiting for status", which blocks every pull
  # request that touches something else (docs/, for instance) no matter how
  # green it is. Running the suite on an unrelated change costs a few minutes;
  # a permanently unmergeable pull request costs more. Push-to-main keeps the
  # filter: nothing gates that direction.
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  php:
    name: PHP (lint, coding standard, unit tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: composer lint

      - name: Coding standard
        run: composer cs:check

      - name: Unit tests
        run: composer test:unit

      - name: Dependency audit
        run: composer audit

  frontend:
    name: Frontend (typecheck, build, e2e)
    runs-on: ubuntu-latest
    services:
      # The collaboration e2e test drives the *real* relay, which persists to
      # a real MariaDB (PLAN.md §5.2) -- same service container as
      # relay-ci.yml, because a mocked store would not prove convergence.
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_only
          MARIADB_DATABASE: betteroffice_relay_test
          MARIADB_USER: betteroffice_relay_test
          MARIADB_PASSWORD: test_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      BETTEROFFICE_RELAY_DB_HOST: 127.0.0.1
      BETTEROFFICE_RELAY_DB_NAME: betteroffice_relay_test
      BETTEROFFICE_RELAY_DB_USER: betteroffice_relay_test
      BETTEROFFICE_RELAY_DB_PASSWORD: test_only_password
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Assert the typecheck runs TypeScript 7
        # A "tsc" script resolves through node_modules/.bin, where any package
        # shipping its own "tsc" bin shadows the root compiler -- an alias of
        # typescript 6 did exactly that while vite-plugin-dts needed it. The
        # typecheck would then run the wrong version and stay green while
        # missing every 7-only error, so ask the scripts themselves which
        # compiler they invoke instead of trusting the package.json name.
        run: |
          status=0
          for script in typecheck typecheck:e2e; do
            used="$(npm run --silent "$script" -- --version)"
            echo "npm run $script -> $used"
            case "$used" in
              *"Version 7."*) ;;
              *) echo "::error::npm run $script did not run TypeScript 7 ($used)"; status=1 ;;
            esac
          done
          exit "$status"

      - run: npm run typecheck

      - name: Typecheck the e2e harness
        # tests/e2e has its own tsconfig (Playwright and Node types); the root
        # one only includes src/, so the specs and their mocks are otherwise
        # the only TypeScript in the repo that CI never type-checks.
        run: npm run typecheck:e2e

      - run: npm run build

      - name: Install relay dependencies and apply its schema
        # The e2e suite starts relay/src/server.ts itself (playwright.config.ts);
        # it only needs its dependencies installed and its schema migrated.
        working-directory: relay
        run: |
          npm ci
          npm run migrate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Editor e2e (mock Nextcloud API, real relay, real MariaDB — see docs/development.md)
        # Twice: each run gets its own room, and a single run cannot show that
        # a repeated one starts clean. A shared room or shared mock state only
        # fails on the second pass, so one pass would let that regress.
        run: npm run test:e2e:repeat

      - name: Upload Playwright traces
        # retain-on-failure (tests/e2e/playwright.config.ts) writes a trace only
        # for the run that failed, so a red repeat leaves the DOM, network and
        # console timeline here instead of just an assertion diff in the log.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          # Relative to the workspace root: defaults.run.working-directory only
          # applies to `run:` steps, not to a `uses:` input.
          path: app/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Dependency audit (shipped bundle only — fails the build)
        run: npm audit --omit=dev

      - name: Dependency audit (build tooling — warns only; tracked gaps in docs/security.md)
        if: always()
        run: npm audit || echo "::warning::npm audit found issues outside production deps; see docs/security.md"
