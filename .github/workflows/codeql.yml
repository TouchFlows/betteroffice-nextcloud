name: CodeQL

# CodeQL does not support PHP (app/lib's language) — composer audit in
# app-ci.yml is this repo's PHP-side dependency/security check instead.
# This workflow covers the JavaScript/TypeScript across app/src, relay/src
# and poc/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
